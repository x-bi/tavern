# Tavern Lite 部署编排
# 用法:
#   1. cp deploy/.env.example .env  并修改 AUTH_TOKEN_SECRET
#   2. docker compose up -d --build
#   3. 新库按需执行 docker compose exec server pnpm db:seed
# 访问: http://<服务器IP>:8080
services:
  server:
    build:
      context: .
      dockerfile: Dockerfile.server
      args:
        NODE_BUILD_MAX_OLD_SPACE_MB: ${NODE_BUILD_MAX_OLD_SPACE_MB:-768}
    image: tavern-server:latest
    container_name: tavern-server
    restart: unless-stopped
    environment:
      NODE_ENV: production
      # 容器内必须监听 0.0.0.0,否则 nginx 容器反代不过来
      SERVER_HOST: 0.0.0.0
      SERVER_PORT: '3100'
      API_PREFIX: api
      REQUEST_BODY_LIMIT: 5mb
      # 绝对路径,避免相对路径在容器不同 cwd 下解析偏差
      DATABASE_URL: 'file:/app/data/tavern-lite.db'
      # 同源部署(前后端同属一个 nginx)时 CORS 可留空
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      # 预置账号 JSON；不提供公开注册。首次登录会写入数据库。
      AUTH_PRESET_USERS_JSON: ${AUTH_PRESET_USERS_JSON:?AUTH_PRESET_USERS_JSON 必须在 .env 中设置}
      # 必填:未设置则 compose 直接拒绝启动
      AUTH_TOKEN_SECRET: ${AUTH_TOKEN_SECRET:?AUTH_TOKEN_SECRET 必须在 .env 中设置}
      AUTH_TOKEN_TTL_SECONDS: ${AUTH_TOKEN_TTL_SECONDS:-604800}
      SHARE_PUBLIC_BASE_URL: ${SHARE_PUBLIC_BASE_URL:?SHARE_PUBLIC_BASE_URL 必须在 .env 中设置}
      # NapCat 容器访问 Tavern 事件回调使用容器内地址。
      QQ_EVENT_CALLBACK_BASE_URL: ${QQ_EVENT_CALLBACK_BASE_URL:-http://server:3100/api}
      # 主站 QQ 页面从容器内读取登录状态和二维码，不公开 NapCat 管理端口。
      QQ_AUTO_NAPCAT_API_BASE_URL: ${QQ_AUTO_NAPCAT_API_BASE_URL:-http://napcat:3000}
      QQ_LOGIN_QR_PATH: ${QQ_LOGIN_QR_PATH:-/app/napcat-cache/qrcode.png}
      # 退出切换 QQ 时仅清理此专用登录数据目录。
      QQ_LOGIN_DATA_PATH: ${QQ_LOGIN_DATA_PATH:-/app/napcat-qq-data}
    volumes:
      - ./data:/app/data
      - ./uploads:/app/uploads
      - ./data/napcat/cache:/app/napcat-cache:ro
      - ./data/napcat/qq:/app/napcat-qq-data

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
      args:
        NODE_BUILD_MAX_OLD_SPACE_MB: ${NODE_BUILD_MAX_OLD_SPACE_MB:-768}
    image: tavern-web:latest
    container_name: tavern-web
    restart: unless-stopped
    ports:
      # 宿主 8080 -> 容器 80。用 8080 避开宝塔自带 nginx 占用的 80。
      # 若想让 web 容器独占 80:先停宝塔 nginx(systemctl stop nginx / 宝塔面板),
      # 再把下方改成 "80:80"。
      - '8080:80'
    depends_on:
      - server

  share-web:
    build:
      context: .
      dockerfile: Dockerfile.share-web
      args:
        NODE_BUILD_MAX_OLD_SPACE_MB: ${NODE_BUILD_MAX_OLD_SPACE_MB:-768}
    image: tavern-share-web:latest
    container_name: tavern-share-web
    restart: unless-stopped
    ports:
      - '8081:80'
    depends_on:
      - server

  napcat:
    image: mlikiowa/napcat-docker:latest
    container_name: tavern-napcat
    restart: unless-stopped
    environment:
      # 官方镜像启动时把 /app/templates/tavern.json 写入 onebot11.json。
      MODE: tavern
    expose:
      - '3000'
    volumes:
      - ./data/napcat/qq:/app/.config/QQ
      - ./data/napcat/config:/app/napcat/config
      - ./data/napcat/plugins:/app/napcat/plugins
      - ./data/napcat/cache:/app/napcat/cache
      - ./deploy/napcat/tavern.json:/app/templates/tavern.json:ro
