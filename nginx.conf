# Tavern Lite 前端 nginx 配置
# 职责:托管前端静态文件 + 反代 /api /uploads 到后端容器

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 上传体积:角色头像 2MB,内容包/角色卡 JSON 导入可能较大,放宽到 20MB
    client_max_body_size 20m;

    # SPA history 模式 fallback:未命中的路径都回退到 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API 反代到后端容器(compose 服务名 server)
    # proxy_pass 不带尾斜杠,保留 /api 前缀完整转发
    location /api/ {
        proxy_pass http://server:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE 流式聊天(POST /api/chat/stream):必须禁用缓冲,否则数据积压流不出去
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # 上传文件反代到后端
    location /uploads/ {
        proxy_pass http://server:3100;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
